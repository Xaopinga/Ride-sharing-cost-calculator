<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顺风车订单成本与盈利计算器</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              display: ["Manrope", "Noto Sans SC", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-white">
  <div class="relative flex min-h-screen w-full flex-col">
    <header class="flex items-center justify-between border-b border-white/10 dark:border-[#23482f] px-4 sm:px-10 py-3">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-3xl text-primary">calculate</span>
        <h1 class="text-lg sm:text-xl font-bold">顺风车成本效益分析工具</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="openSettingsBtn" class="text-white text-sm font-medium hover:text-primary">设置</button>
      </div>
    </header>

    <main class="flex-1 px-4 sm:px-8 md:px-20 lg:px-40 py-6">
      <section id="viewAnalysis" class="grid grid-cols-1 lg:grid-cols-5 gap-8">
        <div class="lg:col-span-3 flex flex-col gap-6">
          <div>
            <p class="text-2xl sm:text-3xl font-black tracking-tight">输入订单信息以分析收益</p>
            <p class="text-[#92c9a4]">快速计算您的顺风车订单盈利情况，优化接单决策。</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <label class="flex flex-col">
              <p class="text-base font-medium pb-2">距起点距离 (公里)</p>
              <input id="pickupDistance" type="number" class="form-input rounded-lg border border-[#326744] bg-[#193322] text-white h-14 p-[15px]" placeholder="例如: 5" value="5.2" />
            </label>
            <label class="flex flex-col">
              <p class="text-base font-medium pb-2">全程距离 (公里)</p>
              <input id="totalDistance" type="number" class="form-input rounded-lg border border-[#326744] bg-[#193322] text-white h-14 p-[15px]" placeholder="例如: 100" value="125.8" />
            </label>
          </div>
          <div>
            <label class="flex flex-col">
              <p class="text-base font-medium pb-2">预估收入 (元)</p>
              <input id="fareIncome" type="number" class="form-input rounded-lg border border-[#326744] bg-[#193322] text-white h-14 p-[15px]" placeholder="例如: 150" value="180" />
            </label>
          </div>
          <div class="bg-[#193322] p-4 rounded-lg border border-[#326744]">
            <label class="flex flex-col">
              <p class="font-medium pb-2">高速费用 (元)</p>
              <input id="tollFee" type="number" class="form-input rounded-lg border border-[#326744] bg-[#102216] text-white h-12 p-3" placeholder="例如: 50" value="0" />
            </label>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <button id="calculateBtn" class="flex items-center justify-center gap-2 rounded-lg h-14 px-6 bg-primary text-[#112217] text-base font-bold">
              <span class="material-symbols-outlined">calculate</span>
              <span>计算收益</span>
            </button>
            <button id="recognizeFromImageBtn" class="flex items-center justify-center gap-2 rounded-lg h-14 px-6 bg-white/10 text-white border border-white/20">
              <span class="material-symbols-outlined">crop_free</span>
              <span>截图识别</span>
            </button>
            <button id="applyLastOrderBtn" class="flex items-center justify-center gap-2 rounded-lg h-14 px-6 bg-white/10 text-white border border-white/20">
              <span class="material-symbols-outlined">history</span>
              <span>套用上一单</span>
            </button>
            <input id="screenshotInput" type="file" accept="image/*" class="hidden" />
          </div>
          <div id="lastOrderInfo" class="hidden text-sm text-[#92c9a4]"></div>
          <button id="autoCalcTollBtn" class="hidden"></button>
        </div>
        <div class="lg:col-span-2 bg-[#193322] p-6 rounded-xl border border-[#326744]">
          <h3 class="text-2xl font-bold mb-6">成本效益分析</h3>
          <div class="flex flex-col gap-4">
            <div class="flex flex-col items-center justify-center bg-[#102216] p-6 rounded-lg">
              <p class="text-[#92c9a4] text-sm font-medium">预估净利润</p>
              <p id="profit" class="text-primary text-5xl font-black tracking-tighter my-2">-</p>
              <div id="profitIndicator" class="flex items-center gap-1.5 text-sm text-[#92c9a4]"></div>
            </div>
            <div class="flex flex-col gap-3">
              <div class="flex justify-between items-center">
                <span class="text-[#92c9a4]">收入明细</span>
                <span id="fareIncomeDisplay" class="font-semibold">-</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-[#92c9a4]">总成本</span>
                <span id="totalCost" class="font-semibold">-</span>
              </div>
              <div class="flex justify-between items-center pl-2">
                <span class="text-sm text-[#7a9e88]">接客油耗</span>
                <span id="pickupCost" class="text-sm font-medium">-</span>
              </div>
              <div class="flex justify-between items-center pl-2">
                <span class="text-sm text-[#7a9e88]">主行程油耗</span>
                <span id="mainTripCost" class="text-sm font-medium">-</span>
              </div>
              <div class="flex justify-between items-center pl-2">
                <span class="text-sm text-[#7a9e88]">高速费</span>
                <span id="tollCost" class="text-sm font-medium">-</span>
              </div>
              <div class="flex justify-between items-center pl-2">
                <span class="text-sm text-[#7a9e88]">单公里收入</span>
                <span id="perKmIncome" class="text-sm font-medium">-</span>
              </div>
              <div class="flex justify-between items-center pl-2">
                <span class="text-sm text-[#7a9e88]">单公里成本</span>
                <span id="perKmCost" class="text-sm font-medium">-</span>
              </div>
              <div class="flex justify-between items-center pl-2">
                <span class="text-sm text-[#7a9e88]">单公里利润</span>
                <span id="perKmProfit" class="text-sm font-medium">-</span>
              </div>
            </div>
            <div class="mt-4">
              <h4 class="mb-2 text-sm">成本与盈利图表</h4>
              <div id="costChart" class="space-y-2"></div>
              <h4 class="mt-4 mb-2 text-sm">不同高速费分摊方案盈利</h4>
              <div id="scenarioChart" class="space-y-2"></div>
              <h4 class="mt-4 mb-2 text-sm">单公里指标（¥/km）</h4>
              <div id="perKmChart" class="space-y-2"></div>
            </div>
            <div class="mt-4">
              <div id="scenarioResults" class="space-y-2"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="viewSettings" class="hidden">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-2xl font-bold">应用设置</h2>
          <button id="backToAnalysisBtn" class="rounded-full h-10 w-10 bg-[#193322] border border-[#326744]">←</button>
        </div>
        <div class="grid grid-cols-1 gap-6">
          <section class="rounded-lg border border-[#326744] bg-[#193322] p-6">
            <h3 class="text-xl font-bold">车辆成本参数</h3>
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
              <label class="flex flex-col">
                <p class="font-medium pb-2">市区油耗 (L/100km)</p>
                <input id="cityConsumption" class="form-input rounded-lg border border-[#326744] bg-[#102216] h-12 p-3" placeholder="例如: 9.5" value="13" />
              </label>
              <label class="flex flex-col">
                <p class="font-medium pb-2">高速油耗 (L/100km)</p>
                <input id="highwayConsumption" class="form-input rounded-lg border border-[#326744] bg-[#102216] h-12 p-3" placeholder="例如: 6.8" value="7" />
              </label>
              <label class="flex flex-col md:col-span-2">
                <p class="font-medium pb-2">高速费费率 (元/公里)</p>
                <div class="flex items-center gap-4">
                  <input id="tollFeeRateRange" type="range" min="0.3" max="0.7" step="0.01" value="0.45" class="w-full" />
                  <input id="tollFeeRate" class="form-input w-24 rounded-lg border border-[#326744] bg-[#102216] h-12 p-3 text-center" value="0.45" />
                </div>
              </label>
            </div>
          </section>
          <section class="rounded-lg border border-[#326744] bg-[#193322] p-6">
            <h3 class="text-xl font-bold">应用偏好</h3>
            <div class="mt-4 flex items-center justify-between">
              <p class="font-medium">启用自动保存</p>
              <label class="relative inline-flex items-center cursor-pointer">
                <input id="enableAutoSave" type="checkbox" class="sr-only peer" checked />
                <div class="w-11 h-6 bg-gray-200 dark:bg-gray-700 rounded-full peer-checked:bg-primary"></div>
              </label>
            </div>
          </section>
          <div class="flex items-center justify-between gap-4 border-t border-[#326744] pt-4">
            <button id="resetSettingsBtn" class="text-sm font-semibold text-red-400">恢复默认设置</button>
            <button id="saveSettingsBtn" class="rounded-lg h-12 px-6 bg-primary text-[#112217] text-base font-bold">保存更改</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
        const SETTINGS_KEY = 'rideshare_calc_settings_v1';
        const LAST_ORDER_KEY = 'rideshare_last_order_v1';

        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.fuelPrice !== undefined && document.getElementById('fuelPrice')) {
                    document.getElementById('fuelPrice').value = data.fuelPrice;
                }
                if (data.cityConsumption !== undefined) {
                    document.getElementById('cityConsumption').value = data.cityConsumption;
                }
                if (data.highwayConsumption !== undefined) {
                    document.getElementById('highwayConsumption').value = data.highwayConsumption;
                }
                if (data.pickupDistance !== undefined) {
                    document.getElementById('pickupDistance').value = data.pickupDistance;
                }
                if (data.tollFeeRate !== undefined) {
                    const r = document.getElementById('tollFeeRate');
                    const rr = document.getElementById('tollFeeRateRange');
                    if (r) r.value = data.tollFeeRate;
                    if (rr) rr.value = data.tollFeeRate;
                }
            } catch (e) {}
        }

        function recognizeFromImage(file) {
            const btn = document.getElementById('recognizeFromImageBtn');
            const input = document.getElementById('screenshotInput');
            if (!btn || !input) return;

            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '识别中...';

            const formData = new FormData();
            formData.append('image', file);

            fetch('/ocr', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP error ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    const text = data && (data.text || data.result || '');
                    fillFromRecognizedText(text);
                })
                .catch(error => {
                    alert('识别失败，请确保截图清晰后重试。');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = originalText;
                    input.value = '';
                });
        }

        function fillFromRecognizedText(text) {
            if (!text) {
                alert('未能从截图中识别出有效文字，请手动输入。');
                return;
            }
            const normalized = text.replace(/\s+/g, '');
            const pickupInput = document.getElementById('pickupDistance');
            const totalInput = document.getElementById('totalDistance');
            const incomeInput = document.getElementById('fareIncome');

            let pickupValue = null;
            let totalValue = null;
            let incomeValue = null;

            const pickupMatch = normalized.match(/距起[点店]?(\d+(?:\.\d+)?)/);
            const totalMatch = normalized.match(/全程(\d+(?:\.\d+)?)/);
            const incomeMatch = normalized.match(/(收|收入|预估?收入|预估?路费)[^0-9]{0,3}(\d+(?:\.\d+)?)/);

            if (pickupMatch) pickupValue = pickupMatch[1];
            if (totalMatch) totalValue = totalMatch[1];
            if (incomeMatch) incomeValue = incomeMatch[2] || incomeMatch[1];

            if (!pickupValue && !totalValue && !incomeValue) {
                const numRegex = /(\d+(?:\.\d+)?)/g;
                let match;
                const candidates = [];
                while ((match = numRegex.exec(normalized)) !== null) {
                    const value = match[1];
                    const start = match.index;
                    const end = start + match[0].length;
                    const before = normalized.slice(Math.max(0, start - 8), start);
                    const after = normalized.slice(end, end + 8);
                    const context = before + '|' + after;
                    candidates.push({ value, context });
                }

                candidates.forEach(c => {
                    const ctx = c.context;
                    if (!pickupValue && /距.*起.*点|距起[点店]/.test(ctx)) { pickupValue = c.value; return; }
                    if (!totalValue && /全程|总路程|总里程/.test(ctx)) { totalValue = c.value; return; }
                    if (!incomeValue && /(收|收入|路费|¥|￥|元)/.test(ctx)) { incomeValue = c.value; return; }
                });

                if (candidates.length >= 1 && !pickupValue) { pickupValue = candidates[0].value; }
                if (candidates.length >= 2 && !totalValue) { totalValue = candidates[1].value; }
                if (candidates.length >= 3 && !incomeValue) { incomeValue = candidates[2].value; }
            }

            if (pickupValue && pickupInput) { pickupInput.value = pickupValue; }
            if (totalValue && totalInput) { totalInput.value = totalValue; }
            if (incomeValue && incomeInput) { incomeInput.value = incomeValue; }

            if (pickupValue || totalValue || incomeValue) {
                const tollFeeInput = document.getElementById('tollFee');
                if (tollFeeInput && !tollFeeInput.hasAttribute('data-manual')) { autoCalculateTollFee(); }
                calculateProfit();
            } else {
                alert('未能从截图中识别出距起点、全程和收入，请手动输入。');
            }
        }

        function saveSettings() {
            try {
                const data = {
                    fuelPrice: document.getElementById('fuelPrice') ? document.getElementById('fuelPrice').value : undefined,
                    cityConsumption: document.getElementById('cityConsumption').value,
                    highwayConsumption: document.getElementById('highwayConsumption').value,
                    pickupDistance: document.getElementById('pickupDistance').value,
                    tollFeeRate: document.getElementById('tollFeeRate') ? document.getElementById('tollFeeRate').value : undefined
                };
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function saveLastOrder(pickupDistance, totalDistance, fareIncome) {
            try {
                const data = { pickupDistance, totalDistance, fareIncome };
                localStorage.setItem(LAST_ORDER_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadLastOrder() {
            const info = document.getElementById('lastOrderInfo');
            if (!info) return;
            try {
                const raw = localStorage.getItem(LAST_ORDER_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.pickupDistance == null || data.totalDistance == null || data.fareIncome == null) return;
                info.classList.remove('hidden');
                info.textContent = `上一次订单：距起点 ${data.pickupDistance} km，全程 ${data.totalDistance} km，收入 ${data.fareIncome} 元`;
                const applyBtn = document.getElementById('applyLastOrderBtn');
                if (applyBtn) {
                    applyBtn.onclick = function() {
                        document.getElementById('pickupDistance').value = data.pickupDistance;
                        document.getElementById('totalDistance').value = data.totalDistance;
                        document.getElementById('fareIncome').value = data.fareIncome;
                        if (!document.getElementById('tollFee').hasAttribute('data-manual')) { autoCalculateTollFee(); }
                        calculateProfit();
                    };
                }
            } catch (e) {}
        }

        document.getElementById('calculateBtn').addEventListener('click', function() { calculateProfit(); });
        document.getElementById('autoCalcTollBtn').addEventListener('click', function() { autoCalculateTollFee(); });

        const recognizeBtn = document.getElementById('recognizeFromImageBtn');
        const screenshotInput = document.getElementById('screenshotInput');
        if (recognizeBtn && screenshotInput) {
            recognizeBtn.addEventListener('click', function() { screenshotInput.click(); });
            screenshotInput.addEventListener('change', function(e) {
                const file = e.target.files && e.target.files[0];
                if (file) { recognizeFromImage(file); }
            });
        }

        const autoSwitch = document.getElementById('autoTollSwitch');
        if (autoSwitch) {
            autoSwitch.addEventListener('change', function() {
                const tollInput = document.getElementById('tollFee');
                if (!tollInput) return;
                if (this.checked) { tollInput.disabled = true; tollInput.removeAttribute('data-manual'); autoCalculateTollFee(); }
                else { tollInput.disabled = false; tollInput.setAttribute('data-manual', 'true'); }
            });
        }

        document.getElementById('totalDistance').addEventListener('input', function() {
            if (!document.getElementById('tollFee').hasAttribute('data-manual')) { autoCalculateTollFee(); }
        });
        document.getElementById('tollFee').addEventListener('focus', function() { this.setAttribute('data-manual', 'true'); });
        (function(){
            const tollInputEl = document.getElementById('tollFee');
            if (tollInputEl) { tollInputEl.addEventListener('input', function() { calculateProfit(); }); }
        })();

        function autoCalculateTollFee() {
            const totalDistance = parseFloat(document.getElementById('totalDistance').value);
            let tollFeeRate = 0.45;
            const r = document.getElementById('tollFeeRate');
            if (r && r.value) { const v = parseFloat(r.value); if (isFinite(v)) tollFeeRate = v; }
            const tollFee = totalDistance * tollFeeRate;
            document.getElementById('tollFee').value = tollFee.toFixed(2);
            document.getElementById('tollFee').removeAttribute('data-manual');
        }

        function calculateProfit() {
            const fuelPrice = parseFloat(document.getElementById('fuelPrice') ? document.getElementById('fuelPrice').value : 6.9);
            const cityConsumption = parseFloat(document.getElementById('cityConsumption').value);
            const highwayConsumption = parseFloat(document.getElementById('highwayConsumption').value);
            const pickupDistance = parseFloat(document.getElementById('pickupDistance').value);
            const totalDistance = parseFloat(document.getElementById('totalDistance').value);
            const tollFee = parseFloat(document.getElementById('tollFee').value);
            const fareIncome = parseFloat(document.getElementById('fareIncome').value);

            saveSettings();
            saveLastOrder(
                document.getElementById('pickupDistance').value,
                document.getElementById('totalDistance').value,
                document.getElementById('fareIncome').value
            );

            const mainTripDistance = Math.max(0, totalDistance - pickupDistance);

            const pickupFuelCost = (cityConsumption / 100) * pickupDistance * fuelPrice;
            const mainTripFuelCost = (highwayConsumption / 100) * mainTripDistance * fuelPrice;
            const totalFuelCost = pickupFuelCost + mainTripFuelCost;

            const totalCostValue = totalFuelCost + tollFee;
            const profit = fareIncome - totalCostValue;

            document.getElementById('pickupCost').textContent = `¥${pickupFuelCost.toFixed(2)}`;
            document.getElementById('mainTripCost').textContent = `¥${mainTripFuelCost.toFixed(2)}`;
            const totalFuelCostEl = document.getElementById('totalFuelCost');
            if (totalFuelCostEl) totalFuelCostEl.textContent = `¥${totalFuelCost.toFixed(2)}`;
            document.getElementById('tollCost').textContent = `¥${tollFee.toFixed(2)}`;
            document.getElementById('totalCost').textContent = `¥${totalCostValue.toFixed(2)}`;
            const fid = document.getElementById('fareIncomeDisplay');
            if (fid) fid.textContent = `¥${fareIncome.toFixed(2)}`;

            const perKmIncomeElement = document.getElementById('perKmIncome');
            const perKmCostElement = document.getElementById('perKmCost');
            const perKmProfitElement = document.getElementById('perKmProfit');

            let incomePerKm = null;
            let costPerKm = null;
            let profitPerKm = null;

            if (totalDistance > 0 && isFinite(totalDistance)) {
                incomePerKm = fareIncome / totalDistance;
                costPerKm = totalCostValue / totalDistance;
                profitPerKm = profit / totalDistance;
                perKmIncomeElement.textContent = `¥${incomePerKm.toFixed(2)}/km`;
                perKmCostElement.textContent = `¥${costPerKm.toFixed(2)}/km`;
                perKmProfitElement.textContent = `¥${profitPerKm.toFixed(2)}/km`;
                perKmProfitElement.className = profitPerKm >= 0 ? 'text-green-400' : 'text-red-400';
            } else {
                perKmIncomeElement.textContent = '-';
                perKmCostElement.textContent = '-';
                perKmProfitElement.textContent = '-';
                perKmProfitElement.className = '';
            }

            const profitElement = document.getElementById('profit');
            profitElement.textContent = `¥ ${profit.toFixed(2)}`;
            profitElement.className = profit >= 0 ? 'text-primary text-5xl font-black tracking-tighter my-2' : 'text-red-400 text-5xl font-black tracking-tighter my-2';

            const profitIndicator = document.getElementById('profitIndicator');
            if (profit >= 0) { profitIndicator.textContent = `此订单可以接，预计盈利 ¥${profit.toFixed(2)}`; }
            else { profitIndicator.textContent = `此订单可能亏损 ¥${Math.abs(profit).toFixed(2)}，建议谨慎考虑`; }

            const scenarioResults = document.getElementById('scenarioResults');
            scenarioResults.innerHTML = '';

            const scenarios = [
                { name: '车主承担全部高速费', tollShare: 1 },
                { name: '乘客承担全部高速费', tollShare: 0 },
                { name: '平均分摊高速费', tollShare: 0.5 },
                { name: '车主承担30%，乘客承担70%', tollShare: 0.3 },
                { name: '车主承担70%，乘客承担30%', tollShare: 0.7 }
            ];

            scenarios.forEach(scenario => {
                const scenarioCost = totalFuelCost + (tollFee * scenario.tollShare);
                const scenarioProfit = fareIncome - scenarioCost;
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center text-sm';
                const name = document.createElement('span');
                name.textContent = scenario.name;
                const val = document.createElement('span');
                val.textContent = `¥${scenarioProfit.toFixed(2)}`;
                if (scenarioProfit < 0) val.className = 'text-red-400'; else val.className = 'text-green-400';
                row.appendChild(name); row.appendChild(val);
                scenarioResults.appendChild(row);
            });

            renderCostChart({ pickupFuelCost, mainTripFuelCost, tollFee, totalCost: totalCostValue, profit });
            renderScenarioChart(scenarios, totalFuelCost, tollFee, fareIncome);
            renderPerKmChart(incomePerKm, costPerKm, profitPerKm);
        }

        function renderCostChart(data) {
            const container = document.getElementById('costChart');
            if (!container) return;
            container.innerHTML = '';
            const items = [
                { label: '接客油耗', value: data.pickupFuelCost },
                { label: '主行程油耗', value: data.mainTripFuelCost },
                { label: '高速费', value: data.tollFee },
                { label: '总成本', value: data.totalCost },
                { label: '盈利', value: data.profit }
            ];
            const max = Math.max(...items.map(item => Math.abs(item.value)), 1);
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 text-sm';
                const label = document.createElement('div');
                label.className = 'min-w-[90px] text-[#92c9a4]';
                label.textContent = item.label;
                const track = document.createElement('div');
                track.className = 'flex-1 h-3 rounded-full bg-white/10 overflow-hidden';
                const fill = document.createElement('div');
                fill.className = item.label === '盈利' && item.value < 0 ? 'h-full bg-red-400' : 'h-full bg-green-400';
                const widthPercent = (Math.abs(item.value) / max) * 100;
                fill.style.width = widthPercent + '%';
                track.appendChild(fill);
                const value = document.createElement('div');
                value.className = 'min-w-[70px] text-right';
                value.textContent = `¥${item.value.toFixed(2)}`;
                row.appendChild(label);
                row.appendChild(track);
                row.appendChild(value);
                container.appendChild(row);
            });
        }

        function renderPerKmChart(incomePerKm, costPerKm, profitPerKm) {
            const container = document.getElementById('perKmChart');
            if (!container) return;
            container.innerHTML = '';
            if (incomePerKm === null || !isFinite(incomePerKm) ||
                costPerKm === null || !isFinite(costPerKm) ||
                profitPerKm === null || !isFinite(profitPerKm)) { return; }
            const items = [
                { label: '单公里收入', value: incomePerKm },
                { label: '单公里成本', value: costPerKm },
                { label: '单公里利润', value: profitPerKm }
            ];
            const max = Math.max(...items.map(item => Math.abs(item.value)), 1);
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 text-sm';
                const label = document.createElement('div');
                label.className = 'min-w-[90px] text-[#92c9a4]';
                label.textContent = item.label;
                const track = document.createElement('div');
                track.className = 'flex-1 h-3 rounded-full bg-white/10 overflow-hidden';
                const fill = document.createElement('div');
                fill.className = item.label === '单公里利润' && item.value < 0 ? 'h-full bg-red-400' : 'h-full bg-green-400';
                const widthPercent = (Math.abs(item.value) / max) * 100;
                fill.style.width = widthPercent + '%';
                track.appendChild(fill);
                const value = document.createElement('div');
                value.className = 'min-w-[70px] text-right';
                value.textContent = `¥${item.value.toFixed(2)}/km`;
                row.appendChild(label);
                row.appendChild(track);
                row.appendChild(value);
                container.appendChild(row);
            });
        }

        function renderScenarioChart(scenarios, totalFuelCost, tollFee, fareIncome) {
            const container = document.getElementById('scenarioChart');
            if (!container) return;
            container.innerHTML = '';
            const profits = scenarios.map(scenario => {
                const scenarioCost = totalFuelCost + (tollFee * scenario.tollShare);
                return fareIncome - scenarioCost;
            });
            const max = Math.max(...profits.map(p => Math.abs(p)), 1);
            scenarios.forEach((scenario, index) => {
                const scenarioProfit = profits[index];
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 text-sm';
                const label = document.createElement('div');
                label.className = 'min-w-[90px] text-[#92c9a4]';
                label.textContent = scenario.name;
                const track = document.createElement('div');
                track.className = 'flex-1 h-3 rounded-full bg-white/10 overflow-hidden';
                const fill = document.createElement('div');
                fill.className = scenarioProfit < 0 ? 'h-full bg-red-400' : 'h-full bg-green-400';
                const widthPercent = (Math.abs(scenarioProfit) / max) * 100;
                fill.style.width = widthPercent + '%';
                track.appendChild(fill);
                const value = document.createElement('div');
                value.className = 'min-w-[70px] text-right';
                value.textContent = `¥${scenarioProfit.toFixed(2)}`;
                row.appendChild(label);
                row.appendChild(track);
                row.appendChild(value);
                container.appendChild(row);
            });
        }

        window.addEventListener('load', function() {
            loadSettings();
            loadLastOrder();
            autoCalculateTollFee();
            calculateProfit();
            const r = document.getElementById('tollFeeRate');
            const rr = document.getElementById('tollFeeRateRange');
            if (r && rr) {
                rr.addEventListener('input', function() { r.value = this.value; autoCalculateTollFee(); });
                r.addEventListener('input', function() { rr.value = this.value; autoCalculateTollFee(); });
            }
            const openSettingsBtn = document.getElementById('openSettingsBtn');
            const backBtn = document.getElementById('backToAnalysisBtn');
            const viewAnalysis = document.getElementById('viewAnalysis');
            const viewSettings = document.getElementById('viewSettings');
            if (openSettingsBtn && backBtn && viewAnalysis && viewSettings) {
                openSettingsBtn.addEventListener('click', function() { viewAnalysis.classList.add('hidden'); viewSettings.classList.remove('hidden'); });
                backBtn.addEventListener('click', function() { viewSettings.classList.add('hidden'); viewAnalysis.classList.remove('hidden'); });
            }
            const saveBtn = document.getElementById('saveSettingsBtn');
            const resetBtn = document.getElementById('resetSettingsBtn');
            if (saveBtn) { saveBtn.addEventListener('click', function() { saveSettings(); autoCalculateTollFee(); calculateProfit(); }); }
            if (resetBtn) {
                resetBtn.addEventListener('click', function() {
                    document.getElementById('cityConsumption').value = 13;
                    document.getElementById('highwayConsumption').value = 7;
                    const r = document.getElementById('tollFeeRate');
                    const rr = document.getElementById('tollFeeRateRange');
                    if (r && rr) { r.value = 0.45; rr.value = 0.45; }
                    autoCalculateTollFee();
                });
            }
            const autoSwitch2 = document.getElementById('autoTollSwitch');
            const tollInput2 = document.getElementById('tollFee');
            if (autoSwitch2 && tollInput2) { tollInput2.disabled = autoSwitch2.checked; }
        });
  </script>
</body>
</html>
